<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CMS Blog | British Propolis Toili</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f7f6;margin:0}.wrap{max-width:1000px;margin:auto;padding:30px 20px}.card{background:#fff;border-radius:14px;padding:22px;margin-bottom:20px;box-shadow:0 5px 20px #0001}input,textarea,select,button{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:8px}textarea{min-height:180px}button{background:#176b45;color:#fff;border:0;font-weight:bold;cursor:pointer}.ai{background:#5b3fb5}.test{background:#555}.small{font-size:13px;color:#666}.post{border-top:1px solid #eee;padding:15px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
<div class="card">
<h1>CMS Blog</h1>
<p>CMS terhubung ke Google Apps Script. Masukkan CMS API Key untuk mengakses data.</p>
<input id="key" type="password" placeholder="CMS API Key">
<button onclick="testConnection()" class="test">Tes Koneksi CMS</button>
<button onclick="loadPosts()">Muat Artikel</button>
<p id="connectionStatus" class="small"></p>
</div>

<div class="card">
<h2>✨ Buat Artikel dengan AI</h2>
<p class="small">AI akan membuat draft yang bisa kamu review dan edit sebelum disimpan.</p>
<input id="aiTopic" placeholder="Topik artikel, contoh: Manfaat propolis untuk menjaga kesehatan keluarga">
<div class="grid">
<input id="aiKeyword" placeholder="Keyword utama">
<select id="aiLanguage"><option>Indonesia</option><option>English</option></select>
<select id="aiStyle"><option value="edukasi">Edukasi</option><option value="tips kesehatan">Tips Kesehatan</option><option value="gaya hidup sehat">Gaya Hidup Sehat</option><option value="informasi produk">Informasi Produk</option></select>
<select id="aiLength"><option value="singkat">Singkat</option><option value="sedang" selected>Sedang</option><option value="panjang">Panjang</option></select>
</div>
<button class="ai" onclick="generateAI()">✨ Generate dengan AI</button>
<p id="aiStatus" class="small"></p>
</div>

<div class="card">
<h2>Artikel</h2>
<input id="slug" placeholder="slug, contoh: tips-kesehatan">
<input id="title" placeholder="Judul">
<input id="category" placeholder="Kategori">
<input id="date" type="date">
<input id="image" placeholder="Path gambar, contoh: assets/images/bpregular/1.png">
<input id="excerpt" placeholder="Ringkasan">
<input id="seo" placeholder="SEO description">
<textarea id="content" placeholder="Isi artikel HTML"></textarea>
<button onclick="savePost()">Simpan Artikel</button>
<button onclick="publish()">Publish ke Facebook</button>
<p id="status" class="small"></p>
</div>

<div class="card">
<h2>Daftar Artikel</h2>
<div id="list">Belum dimuat.</div>
</div>
</main>

<script>
const APPS_SCRIPT_URL='https://script.google.com/macros/s/AKfycbxHiGLnhLXEt33YgWMvZYxyH6uQ86ncMIrhH2IzxAejUH7LeOyFRNQNmEnc8ATkXPJ0/exec';
const $=id=>document.getElementById(id);

async function api(action,data={}){
  const payload={action,apiKey:$('key').value.trim(),...data};
  payload.api_key=payload.apiKey;
  const r=await fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
  const text=await r.text();
  let x;
  try{x=JSON.parse(text)}catch(e){throw Error('Respons CMS bukan JSON. Kemungkinan Web App Apps Script belum diperbarui/deploy.')}
  return x;
}

async function testConnection(){
  $('connectionStatus').textContent='Mengecek koneksi CMS...';
  try{
    if(!$('key').value.trim()) throw Error('CMS API Key belum diisi.');
    const x=await api('list_posts');
    if(!x.ok) throw Error(x.error||'Koneksi CMS gagal.');
    $('connectionStatus').textContent='✓ Koneksi CMS OK. '+((x.posts||[]).length)+' artikel ditemukan.';
  }catch(e){$('connectionStatus').textContent='✗ '+e.message}
}

async function loadPosts(){
  try{
    const x=await api('list_posts');
    if(!x.ok)throw Error(x.error||'Gagal');
    $('list').innerHTML=(x.posts||[]).map(p=>`<div class="post"><b>${p.title}</b><div class="small">${p.category||''} · ${p.date||''}</div><button onclick='edit(${JSON.stringify(p)})'>Edit</button></div>`).join('')||'Belum ada artikel.';
    $('status').textContent='Artikel berhasil dimuat.';
  }catch(e){$('status').textContent=e.message}
}

function edit(p){['slug','title','category','date','image','excerpt','content'].forEach(k=>$(k).value=p[k]||'');$('seo').value=p.seo_description||''}

async function generateAI(){
  try{
    const topic=$('aiTopic').value.trim();
    if(!topic){$('aiStatus').textContent='Topik artikel wajib diisi.';return}
    $('aiStatus').textContent='AI sedang membuat artikel...';
    const x=await api('generate_ai_article',{prompt:{topic:topic,keyword:$('aiKeyword').value.trim(),language:$('aiLanguage').value,style:$('aiStyle').value,length:$('aiLength').value}});
    if(!x.ok)throw Error(x.error||'Gagal membuat artikel');
    const a=x.article||{};
    $('slug').value=a.slug||'';$('title').value=a.title||'';$('category').value=a.category||'';$('date').value=a.date||'';$('image').value=a.image||'';$('excerpt').value=a.excerpt||'';$('seo').value=a.seo_description||'';$('content').value=a.content||'';
    $('aiStatus').textContent='Draft artikel berhasil dibuat. Silakan review sebelum disimpan.';
  }catch(e){$('aiStatus').textContent=e.message}
}

async function savePost(){
  try{
    const data={post:{slug:$('slug').value.trim(),title:$('title').value.trim(),category:$('category').value.trim(),date:$('date').value,image:$('image').value.trim(),excerpt:$('excerpt').value.trim(),seo_description:$('seo').value.trim(),content:$('content').value}};
    const x=await api('save_post',data);
    $('status').textContent=x.ok?'Artikel tersimpan.':(x.error||'Gagal menyimpan');
  }catch(e){$('status').textContent=e.message}
}

async function publish(){
  try{
    const x=await api('publish_facebook',{slug:$('slug').value.trim()});
    $('status').textContent=x.ok?'Berhasil dikirim ke Facebook Page.':(x.error||'Gagal publish');
  }catch(e){$('status').textContent=e.message}
}
</script>
</body>
</html>
