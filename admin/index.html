<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CMS Blog | British Propolis Toili</title><style>body{font-family:Arial,sans-serif;background:#f4f7f6;margin:0}.wrap{max-width:1000px;margin:auto;padding:30px 20px}.card{background:#fff;border-radius:14px;padding:22px;margin-bottom:20px;box-shadow:0 5px 20px #0001}input,textarea,button{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:8px}textarea{min-height:180px}button{background:#176b45;color:#fff;border:0;font-weight:bold;cursor:pointer}.danger{background:#b33}.post{border-top:1px solid #eee;padding:15px 0}.small{font-size:13px;color:#666}</style></head><body><main class="wrap"><div class="card"><h1>CMS Blog</h1><p>Kelola artikel melalui Google Apps Script. Simpan kredensial backend hanya di Apps Script.</p><input id="api" placeholder="Apps Script Web App URL"><input id="key" type="password" placeholder="CMS API Key"><button onclick="loadPosts()">Muat Artikel</button></div><div class="card"><h2>Artikel</h2><input id="slug" placeholder="slug, contoh: tips-kesehatan"><input id="title" placeholder="Judul"><input id="category" placeholder="Kategori"><input id="date" type="date"><input id="image" placeholder="Path gambar, contoh: assets/images/bpregular/1.png"><input id="excerpt" placeholder="Ringkasan"><textarea id="content" placeholder="Isi artikel HTML"></textarea><button onclick="savePost()">Simpan Artikel</button><button onclick="publish()">Publish ke Facebook</button><p id="status" class="small"></p></div><div class="card"><h2>Daftar Artikel</h2><div id="list">Belum dimuat.</div></div></main><script>const $=id=>document.getElementById(id);async function api(action,data={}){const url=$('api').value.trim();if(!url)throw Error('Isi URL Apps Script');const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,apiKey:$('key').value.trim(),...data})});return r.json()}async function loadPosts(){try{const x=await api('list_posts');if(!x.ok)throw Error(x.error||'Gagal');$('list').innerHTML=(x.posts||[]).map(p=>`<div class="post"><b>${p.title}</b><div class="small">${p.category||''} · ${p.date||''}</div><button onclick='edit(${JSON.stringify(p)})'>Edit</button></div>`).join('')||'Belum ada artikel.';$('status').textContent='Artikel berhasil dimuat.'}catch(e){$('status').textContent=e.message}}function edit(p){['slug','title','category','date','image','excerpt','content'].forEach(k=>$(k).value=p[k]||'')}async function savePost(){try{const data={post:{slug:$('slug').value.trim(),title:$('title').value.trim(),category:$('category').value.trim(),date:$('date').value,image:$('image').value.trim(),excerpt:$('excerpt').value.trim(),content:$('content').value}};const x=await api('save_post',data);$('status').textContent=x.ok?'Artikel tersimpan.':(x.error||'Gagal menyimpan')}catch(e){$('status').textContent=e.message}}async function publish(){try{const x=await api('publish_facebook',{slug:$('slug').value.trim()});$('status').textContent=x.ok?'Berhasil dikirim ke Facebook Page.':(x.error||'Gagal publish')}catch(e){$('status').textContent=e.message}}</script></body></html>
