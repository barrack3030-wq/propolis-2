<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Artikel | British Propolis Toili</title><meta name="description" content="Artikel British Propolis Toili"><link rel="stylesheet" href="assets/css/style.css"><style>body{background:#f7faf9}.article{max-width:850px;margin:auto;padding:120px 20px 70px}.article img{width:100%;max-height:480px;object-fit:cover;border-radius:20px;margin:25px 0}.article h1{font-size:2.5rem;line-height:1.2}.meta{opacity:.65}.content{font-size:1.05rem;line-height:1.9}.back{position:fixed;top:18px;left:20px;background:#fff;padding:9px 15px;border-radius:30px;text-decoration:none;box-shadow:0 4px 18px #0002;z-index:5}</style></head><body><a class="back" href="blog.html">← Blog</a><main id="article" class="article"><p>Memuat artikel...</p></main><script>(async()=>{const el=document.getElementById('article');const slug=new URLSearchParams(location.search).get('slug');try{const r=await fetch('content/posts/index.json?'+Date.now());const posts=await r.json();const p=posts.find(x=>x.slug===slug);if(!p)throw 0;document.title=p.title+' | British Propolis Toili';el.innerHTML=`<div class="meta">${p.category} · ${new Date(p.date).toLocaleDateString('id-ID')}</div><h1>${p.title}</h1><img src="${p.image}" alt="${p.title}"><div class="content">${p.content}</div>`}catch(e){el.innerHTML='<h1>Artikel tidak ditemukan</h1><p>Silakan kembali ke halaman Blog.</p>'}})();</script></body></html>
