<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Artikel | British Propolis Toili</title><meta name="description" content="Artikel British Propolis Toili"><link rel="stylesheet" href="assets/css/style.css"><style>body{background:#f7faf9}.article{max-width:850px;margin:auto;padding:120px 20px 70px}.article img{width:100%;max-height:480px;object-fit:cover;border-radius:20px;margin:25px 0}.article h1{font-size:2.5rem;line-height:1.2}.meta{opacity:.65}.content{font-size:1.05rem;line-height:1.9}.content img{width:auto;max-width:100%;max-height:none;margin:15px 0}.content blockquote{margin:20px 0;padding:10px 18px;border-left:4px solid #176b45;background:#eef7f2}.content table{width:100%;border-collapse:collapse}.content th,.content td{border:1px solid #d8e1dc;padding:8px;text-align:left}.content pre{background:#17352a;color:#fff;padding:15px;border-radius:10px;overflow:auto}.content code{background:#eaf1ed;padding:2px 5px;border-radius:4px}.back{position:fixed;top:18px;left:20px;background:#fff;padding:9px 15px;border-radius:30px;text-decoration:none;box-shadow:0 4px 18px #0002;z-index:5}@media(max-width:600px){.article{padding-top:100px}.article h1{font-size:2rem}}
</style></head><body><a class="back" href="blog.html">← Blog</a><main id="article" class="article"><p>Memuat artikel...</p></main>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<script>(async()=>{const el=document.getElementById('article');const slug=new URLSearchParams(location.search).get('slug');try{const r=await fetch('content/posts/index.json?'+Date.now());if(!r.ok)throw 0;const posts=await r.json();const p=posts.find(x=>x.slug===slug);if(!p)throw 0;document.title=p.title+' | British Propolis Toili';const desc=p.seo_description||p.excerpt||'Artikel British Propolis Toili';let m=document.querySelector('meta[name="description"]');if(m)m.setAttribute('content',desc);const rendered=DOMPurify.sanitize(marked.parse(String(p.content||''),{gfm:true,breaks:true}));el.innerHTML='<div class="meta">'+esc(p.category)+' · '+new Date(p.date).toLocaleDateString('id-ID')+'</div><h1>'+esc(p.title)+'</h1>'+(p.image?'<img src="'+esc(p.image)+'" alt="'+esc(p.title)+'">':'')+'<div class="content">'+rendered+'</div>'}catch(e){el.innerHTML='<h1>Artikel tidak ditemukan</h1><p>Silakan kembali ke halaman Blog.</p>'}})();function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]) )}</script></body></html>
